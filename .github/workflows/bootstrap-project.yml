name: Bootstrap project

on:
  push:
    branches:
      - feat/strava-like-heatmap-mvp
    paths:
      - .github/workflows/bootstrap-project.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/strava-like-heatmap-mvp
          fetch-depth: 0

      - name: Extract project archive
        shell: bash
        run: |
          cat .bootstrap/chunk-* | base64 --decode > /tmp/heatmap-project.tar.gz
          tar -xzf /tmp/heatmap-project.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml

      - name: Commit generated project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Strava-style heatmap MVP"
          git push origin HEAD:feat/strava-like-heatmap-mvp
