name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: heatmap
          POSTGRES_USER: heatmap
          POSTGRES_PASSWORD: heatmap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heatmap -d heatmap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STORAGE_MODE: postgres
      DATABASE_URL: postgres://heatmap:heatmap@127.0.0.1:5432/heatmap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: npm install
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run check
      - run: npm test
      - name: Verify seeded dataset
        run: |
          test "$(docker exec ${{ job.services.postgres.id }} psql -U heatmap -d heatmap -Atc 'select count(*) from activities')" = "72"

  visual:
    runs-on: ubuntu-latest
    needs: quality
    env:
      STORAGE_MODE: file
      DATA_FILE: ../../data/ci-heatmap.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:visual
      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heatmap-visual-artifacts-${{ github.sha }}
          path: |
            test-results/**/overview.png
            test-results/**/detail.png
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
